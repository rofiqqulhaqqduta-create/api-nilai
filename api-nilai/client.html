<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Nilai</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: .5rem; grid-template-columns: repeat(2, 1fr); margin-bottom: 1rem; }
    input, select, button { padding: .5rem; font-size: 1rem; }
    button { grid-column: span 2; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
    th { background: #f2f2f2; }
    #pesan { margin: .5rem 0; min-height: 1.5rem; }
    .ok { color: #0a7d2c; } .err { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Data Nilai</h1>

  <form id="form">
    <input id="nim" placeholder="NIM (8 digit)" maxlength="8" required>
    <input id="nama" placeholder="Nama" required>
    <input id="mk" placeholder="Mata kuliah" required>
    <input id="nilai" type="number" step="any" min="0" max="100" placeholder="Nilai (0-100)" required>
    <button type="submit">Simpan</button>
  </form>

  <div id="pesan"></div>

  <label>Filter:
    <select id="filter">
      <option value="">Semua</option>
      <option value="Lulus">Lulus</option>
      <option value="Tidak Lulus">Tidak Lulus</option>
    </select>
  </label>

  <table>
    <thead>
      <tr><th>ID</th><th>NIM</th><th>Nama</th><th>Mata Kuliah</th><th>Nilai</th><th>Grade</th><th>Keterangan</th></tr>
    </thead>
    <tbody id="isi"></tbody>
  </table>

  <script>
    const API = 'api/nilai';
    const $ = (id) => document.getElementById(id);

    function tampilPesan(teks, ok) {
      const el = $('pesan');
      el.textContent = teks;
      el.className = ok ? 'ok' : 'err';
    }

    async function muatData() {
      const f = $('filter').value;
      const url = f ? API + '?keterangan=' + encodeURIComponent(f) : API;
      try {
        const res = await fetch(url);
        const json = await res.json();
        const isi = $('isi');
        isi.replaceChildren();
        (json.data || []).forEach((r) => {
          const tr = document.createElement('tr');
          [r.id, r.nim ?? '-', r.nama, r.mata_kuliah, r.nilai, r.grade ?? '-', r.keterangan].forEach((v) => {
            const td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
          });
          isi.appendChild(tr);
        });
      } catch (e) {
        tampilPesan('Gagal memuat data. Pastikan server berjalan.', false);
      }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nilaiTeks = $('nilai').value.trim();
      const body = {
        nim: $('nim').value.trim(),
        nama: $('nama').value.trim(),
        mata_kuliah: $('mk').value.trim(),
        nilai: nilaiTeks === '' ? null : Number(nilaiTeks),
      };
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const json = await res.json();
        if (res.ok) {
          tampilPesan(json.pesan, true);
          $('form').reset();
          muatData();
        } else {
          tampilPesan((json.detail || [json.pesan]).join('; '), false);
        }
      } catch (err) {
        tampilPesan('Gagal mengirim data.', false);
      }
    });

    $('filter').addEventListener('change', muatData);
    muatData();
  </script>
</body>
</html>
